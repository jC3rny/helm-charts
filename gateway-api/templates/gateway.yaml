{{- if .Values.gateway.enabled -}}
{{- $fullName := include "gateway-api.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}
  namespace: {{ include "gateway-api.namespace" . }}
  labels:
    {{- include "gateway-api.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.gateway.gatewayClassName }}
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  {{- else }}
  gatewayClassName: {{ $fullName }}
  {{- end }}
  {{- with .Values.gateway.listeners }}
  listeners:
    {{- tpl (. | toYaml) $ | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.gateway.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
