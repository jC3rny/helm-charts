{{- if .Values.envoyGateway.envoyExtensionPolicy.enabled -}}
{{- $fullName := include "gateway-api.fullname" . -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: {{ .Values.envoyGateway.envoyExtensionPolicy.nameOverride | default (printf "%s-%s" $fullName (.Values.envoyGateway.envoyExtensionPolicy.name | default "")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "gateway-api.namespace" . }}
  labels:
    {{- include "gateway-api.labels" . | nindent 4 }}
    {{- with .Values.envoyGateway.envoyExtensionPolicy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.envoyGateway.envoyExtensionPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.envoyGateway.envoyExtensionPolicy.spec }}
  {{- tpl (. | toYaml) $ | nindent 2 }}
  {{- end }}
{{- end }}
