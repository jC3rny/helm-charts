{{- if .Values.envoyGateway.backend.enabled -}}
{{- $fullName := include "gateway-api.fullname" . -}}
{{- $backend := .Values.envoyGateway.backend -}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ $backend.nameOverride | default (printf "%s-%s" $fullName ($backend.name | default "")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "gateway-api.namespace" . }}
  labels:
    {{- include "gateway-api.labels" . | nindent 4 }}
    {{- with $backend.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $backend.spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
