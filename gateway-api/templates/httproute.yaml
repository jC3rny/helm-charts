{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "gateway-api.fullname" . -}}
{{- $httpRoute := .Values.httpRoute -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gateway-api.resourceName" (mergeOverwrite . $httpRoute) }}
  namespace: {{ include "gateway-api.namespace" . }}
  labels:
    {{- include "gateway-api.labels" . | nindent 4 }}
    {{- with $httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with $httpRoute.parentRefs }}
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
  {{- with $httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $httpRoute.rules }}
  rules:
    {{- tpl (. | toYaml) $ | nindent 4 }}
  {{- end }}
{{- end }}
