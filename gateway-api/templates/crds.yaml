{{- if .Values.crds.enabled -}}
{{- $expEnabled := .Values.crds.experimental.enabled }}
{{- $expList := .Values.crds.experimental.list }}
{{/*
  Standard CRDs: skip any whose short name is in the experimental list
  (the experimental version will be used instead).
*/}}
{{- range $path, $_ := .Files.Glob "crds/standard/**.yaml" }}
{{- $filename := base $path }}
{{- $shortName := $filename | trimPrefix "gateway.networking.k8s.io_" | trimPrefix "gateway.networking.x-k8s.io_" | trimSuffix ".yaml" }}
{{- if not (and $expEnabled (has $shortName $expList)) }}
{{- $crd := $.Files.Get $path | fromYaml }}
---
apiVersion: {{ $crd.apiVersion }}
kind: {{ $crd.kind }}
metadata:
  name: {{ $crd.metadata.name }}
  annotations:
    {{- if $.Values.crds.resourcePolicy }}
    helm.sh/resource-policy: {{ $.Values.crds.resourcePolicy }}
    {{- end }}
    {{- with $crd.metadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "gateway-api.labels" $ | nindent 4 }}
    {{- with $crd.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml $crd.spec | nindent 2 }}
{{- end }}
{{- end }}
{{/*
  Experimental CRDs: install those whose short name is in the experimental list.
*/}}
{{- if $expEnabled -}}
{{- range $path, $_ := .Files.Glob "crds/experimental/**.yaml" }}
{{- $filename := base $path }}
{{- $shortName := $filename | trimPrefix "gateway.networking.k8s.io_" | trimPrefix "gateway.networking.x-k8s.io_" | trimSuffix ".yaml" }}
{{- if has $shortName $expList }}
{{- $crd := $.Files.Get $path | fromYaml }}
---
apiVersion: {{ $crd.apiVersion }}
kind: {{ $crd.kind }}
metadata:
  name: {{ $crd.metadata.name }}
  annotations:
    {{- if $.Values.crds.resourcePolicy }}
    helm.sh/resource-policy: {{ $.Values.crds.resourcePolicy }}
    {{- end }}
    {{- with $crd.metadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "gateway-api.labels" $ | nindent 4 }}
    {{- with $crd.metadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- toYaml $crd.spec | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
