{{- if .Values.backendTLSPolicy.enabled -}}
{{- $fullName := include "gateway-api.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Values.backendTLSPolicy.nameOverride | default (printf "%s-%s" $fullName (.Values.backendTLSPolicy.name | default "")) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "gateway-api.namespace" . }}
  labels:
    {{- include "gateway-api.labels" . | nindent 4 }}
    {{- with .Values.backendTLSPolicy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.backendTLSPolicy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.backendTLSPolicy.targetRefs }}
  targetRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.backendTLSPolicy.validation }}
  validation:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
