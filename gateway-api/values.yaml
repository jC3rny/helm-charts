# -- UDPRoute provides a way to route UDP requests
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.UDPRoute
udpRoute:
  # UDPRoute enabled.
  enabled: false
