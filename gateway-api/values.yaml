# -- TLSRoute provides a way to route TLS requests
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.TLSRoute
tlsRoute:
  # TLSRoute enabled.
  enabled: false
  # TLSRoute name suffix appended to the chart fullname.
  name: ""
