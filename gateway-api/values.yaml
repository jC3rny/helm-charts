# -- ReferenceGrant allows resources in one namespace to reference resources in another
# For more information: https://gateway-api.sigs.k8s.io/api-types/referencegrant/
referenceGrant:
  # ReferenceGrant enabled.
  enabled: false
  # ReferenceGrant name suffix appended to the chart fullname.
  name: ""
  # ReferenceGrant name override. Replaces the full resource name.
  nameOverride: ""
  # ReferenceGrant annotations.
  annotations: {}
  # ReferenceGrant labels.
  labels: {}
  # Namespaces and resources that can reference resources in this namespace.
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default
  # Resources in this namespace that can be referenced.
  to:
  - group: ""
    kind: Service
  # - group: ""
  #   kind: Secret


# -- Envoy Gateway resources
# For more information: https://gateway.envoyproxy.io/
envoyGateway:
  # Envoy Gateway CRD installation.
  # CRDs are fetched from https://github.com/envoyproxy/gateway by scripts/fetch-crds.sh.
  crds:
    # Install Envoy Gateway CRDs.
    enabled: false
    # Envoy Gateway version to fetch CRDs from.
    version: "v1.9.1"

  # -- Backend defines a backend endpoint for routing traffic
  # For more information: https://gateway.envoyproxy.io/docs/api/extension_types/#backend
  backend:
    # Backend enabled.
    enabled: false
    # Backend name suffix appended to the chart fullname.
    name: ""
    # Backend name override. Replaces the full resource name.
    nameOverride: ""
    # Backend annotations.
    annotations: {}
    # Backend labels.
    labels: {}
    # Backend spec.
    spec: {}
    # spec:
    #   endpoints:
    #   - fqdn:
    #       hostname: primary.example.com
    #       port: 3000

  # -- BackendTrafficPolicy defines traffic management rules for backend connections
