# Default values for gateway-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is to override the release namespace.
namespaceOverride: ""

# -- Gateway API CRD installation
# Use scripts/fetch-crds.sh to download CRDs before packaging.
crds:
  # Install standard Gateway API CRDs.
  enabled: false
  # Gateway-API version to fetch CRDs from.
  version: "1.6.1"
  # Set to "keep" to prevent CRD deletion on helm uninstall. Set to "" to allow deletion.
  resourcePolicy: keep
  # Experimental CRDs. CRDs listed here use the experimental version (with experimental fields).
  # For CRDs that also exist in standard, the experimental version replaces the standard one.
  experimental:
    # Enable experimental CRD selection.
    enabled: false
    # List of experimental CRDs to install (empty = none).
    # Run scripts/fetch-crds.sh to see available CRDs in crds/experimental/.
    # Short names are derived from filenames (e.g. gateway.networking.k8s.io_tcproutes.yaml -> tcproutes).
    list: []
    # list:
    # - gateways
    # - httproutes
    # - tcproutes
    # - tlsroutes
    # - udproutes

# -- GatewayClass defines a set of Gateways that share a common configuration and behaviour
# For more information: https://gateway-api.sigs.k8s.io/api-types/gatewayclass/
gatewayClass:
  # GatewayClass enabled.
  enabled: false
  # GatewayClass annotations.
  annotations: {}
  # GatewayClass labels.
  labels: {}
  # Controller that manages Gateways of this class.
  controllerName: ""
  # Parameters for this GatewayClass (optional).
  # parametersRef:
  #   group: ""
  #   kind: ConfigMap
  #   name: gateway-config
  #   namespace: default
  # Description for the GatewayClass.
  description: ""

# -- Gateway defines a point of access into the cluster
# For more information: https://gateway-api.sigs.k8s.io/api-types/gateway/
gateway:
  # Gateway enabled.
  enabled: false
  # Gateway annotations.
  annotations: {}
  # Gateway labels.
  labels: {}
  # Name of the GatewayClass for this Gateway.
  # Defaults to the chart fullname if not set.
  gatewayClassName: ""
  # Gateway listeners define the ports, protocols, and hostnames.
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    # hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
  # - name: https
  #   protocol: HTTPS
  #   port: 443
  #   hostname: "*.example.com"
  #   tls:
  #     mode: Terminate
  #     certificateRefs:
  #     - kind: Secret
  #       name: example-tls
  #   allowedRoutes:
  #     namespaces:
  #       from: Same
  # Which namespaces may attach a ListenerSet to this Gateway (optional).
  # Unset means None — "only listeners defined in the Gateway's own spec" — so
  # every ListenerSet is rejected with Accepted=False until this is set.
  # ListenerSet is standard channel from Gateway API 1.6.
  # allowedListeners:
  #   namespaces:
  #     from: Same        # Same | All | Selector
  # Gateway addresses (optional).
  # addresses:
  # - type: IPAddress
  #   value: "1.2.3.4"
  # Infrastructure configuration for the Gateway (optional).
  # infrastructure:
  #   labels: {}
  #   annotations: {}

# -- HTTPRoute defines HTTP rules for routing traffic from a Gateway to backend services
# For more information: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute name suffix appended to the chart fullname.
  name: ""
  # HTTPRoute name override. Replaces the full resource name.
  nameOverride: ""
  # HTTPRoute annotations.
  annotations: {}
  # HTTPRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames: []
  # - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: my-service
      port: 80
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- GRPCRoute defines gRPC rules for routing traffic from a Gateway to backend services
# For more information: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
grpcRoute:
  # GRPCRoute enabled.
  enabled: false
  # GRPCRoute name suffix appended to the chart fullname.
  name: ""
  # GRPCRoute name override. Replaces the full resource name.
  nameOverride: ""
  # GRPCRoute annotations.
  annotations: {}
  # GRPCRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs: []
  # parentRefs:
  # - name: gateway
  #   sectionName: grpc
  # Hostnames matching gRPC header.
  # hostnames:
  # - grpc.example.com
  # List of gRPC routing rules.
  rules: []
  # rules:
  # - matches:
  #   - method:
  #       service: my.package.MyService
  #       method: DoSomething
  #   backendRefs:
  #   - name: my-grpc-service
  #     port: 50051

# -- BackendTLSPolicy defines TLS configuration for backend connections
# For more information: https://gateway-api.sigs.k8s.io/api-types/backendtlspolicy/
backendTLSPolicy:
  # BackendTLSPolicy enabled.
  enabled: false
  # BackendTLSPolicy name suffix appended to the chart fullname.
  name: ""
  # BackendTLSPolicy name override. Replaces the full resource name.
  nameOverride: ""
  # BackendTLSPolicy annotations.
  annotations: {}
  # BackendTLSPolicy labels.
  labels: {}
  # Backend references this policy applies to.
  targetRefs: []
  # targetRefs:
  # - group: ""
  #   kind: Service
  #   name: my-service
  # TLS validation configuration.
  validation: {}
  # validation:
  #   caCertificateRefs:
  #   - group: ""
  #     kind: ConfigMap
  #     name: backend-ca
  #   hostname: backend.example.com

# -- TCPRoute provides a way to route TCP requests
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1.TCPRoute
tcpRoute:
  # TCPRoute enabled.
  enabled: false
