# Default values for gateway-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# -- Gateway API CRD installation
# Use scripts/fetch-crds.sh to download CRDs before packaging.
crds:
  # Install standard Gateway API CRDs.
  enabled: false
  # Set to "keep" to prevent CRD deletion on helm uninstall. Set to "" to allow deletion.
  resourcePolicy: keep
  # Experimental CRDs (only those not included in standard).
  experimental:
    # Install experimental CRDs.
    enabled: false
    # List of experimental CRDs to install (empty = none).
    # Available: tcproutes, tlsroutes, udproutes
    list: []
    # list:
    # - tcproutes
    # - tlsroutes
    # - udproutes

# -- GatewayClass defines a set of Gateways that share a common configuration and behaviour
# For more information: https://gateway-api.sigs.k8s.io/api-types/gatewayclass/
gatewayClass:
  # GatewayClass enabled.
  enabled: true
  # GatewayClass annotations.
  annotations: {}
  # GatewayClass labels.
  labels: {}
  # Controller that manages Gateways of this class.
  controllerName: ""
  # Parameters for this GatewayClass (optional).
  # parametersRef:
  #   group: ""
  #   kind: ConfigMap
  #   name: gateway-config
  #   namespace: default
  # Description for the GatewayClass.
  description: ""

# -- Gateway defines a point of access into the cluster
# For more information: https://gateway-api.sigs.k8s.io/api-types/gateway/
gateway:
  # Gateway enabled.
  enabled: true
  # Gateway annotations.
  annotations: {}
  # Gateway labels.
  labels: {}
  # Name of the GatewayClass for this Gateway.
  # Defaults to the chart fullname if not set.
  gatewayClassName: ""
  # Gateway listeners define the ports, protocols, and hostnames.
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    # hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
  # - name: https
  #   protocol: HTTPS
  #   port: 443
  #   hostname: "*.example.com"
  #   tls:
  #     mode: Terminate
  #     certificateRefs:
  #     - kind: Secret
  #       name: example-tls
  #   allowedRoutes:
  #     namespaces:
  #       from: Same
  # Gateway addresses (optional).
  # addresses:
  # - type: IPAddress
  #   value: "1.2.3.4"
  # Infrastructure configuration for the Gateway (optional).
  # infrastructure:
  #   labels: {}
  #   annotations: {}

# -- HTTPRoute defines HTTP rules for routing traffic from a Gateway to backend services
# For more information: https://gateway-api.sigs.k8s.io/api-types/httproute/
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # HTTPRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: my-service
      port: 80
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# -- GRPCRoute defines gRPC rules for routing traffic from a Gateway to backend services
# For more information: https://gateway-api.sigs.k8s.io/api-types/grpcroute/
grpcRoute:
  # GRPCRoute enabled.
  enabled: false
  # GRPCRoute annotations.
  annotations: {}
  # GRPCRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs: []
  # parentRefs:
  # - name: gateway
  #   sectionName: grpc
  # Hostnames matching gRPC header.
  # hostnames:
  # - grpc.example.com
  # List of gRPC routing rules.
  rules: []
  # rules:
  # - matches:
  #   - method:
  #       service: my.package.MyService
  #       method: DoSomething
  #   backendRefs:
  #   - name: my-grpc-service
  #     port: 50051

# -- BackendTLSPolicy defines TLS configuration for backend connections
# For more information: https://gateway-api.sigs.k8s.io/api-types/backendtlspolicy/
backendTLSPolicy:
  # BackendTLSPolicy enabled.
  enabled: false
  # BackendTLSPolicy annotations.
  annotations: {}
  # BackendTLSPolicy labels.
  labels: {}
  # Backend references this policy applies to.
  targetRefs: []
  # targetRefs:
  # - group: ""
  #   kind: Service
  #   name: my-service
  # TLS validation configuration.
  validation: {}
  # validation:
  #   caCertificateRefs:
  #   - group: ""
  #     kind: ConfigMap
  #     name: backend-ca
  #   hostname: backend.example.com

# -- TCPRoute provides a way to route TCP requests (experimental)
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1alpha2.TCPRoute
tcpRoute:
  # TCPRoute enabled.
  enabled: false
  # TCPRoute annotations.
  annotations: {}
  # TCPRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs: []
  # parentRefs:
  # - name: gateway
  #   sectionName: tcp
  # List of TCP routing rules.
  rules: []
  # rules:
  # - backendRefs:
  #   - name: my-tcp-service
  #     port: 5432

# -- TLSRoute provides a way to route TLS requests (experimental)
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1alpha2.TLSRoute
tlsRoute:
  # TLSRoute enabled.
  enabled: false
  # TLSRoute annotations.
  annotations: {}
  # TLSRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs: []
  # parentRefs:
  # - name: gateway
  #   sectionName: tls
  # Hostnames for TLS SNI matching.
  # hostnames:
  # - tls.example.com
  # List of TLS routing rules.
  rules: []
  # rules:
  # - backendRefs:
  #   - name: my-tls-service
  #     port: 8443

# -- UDPRoute provides a way to route UDP requests (experimental)
# For more information: https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io/v1alpha2.UDPRoute
udpRoute:
  # UDPRoute enabled.
  enabled: false
  # UDPRoute annotations.
  annotations: {}
  # UDPRoute labels.
  labels: {}
  # Which Gateways this Route is attached to.
  parentRefs: []
  # parentRefs:
  # - name: gateway
  #   sectionName: udp
  # List of UDP routing rules.
  rules: []
  # rules:
  # - backendRefs:
  #   - name: my-udp-service
  #     port: 53

# -- ReferenceGrant allows resources in one namespace to reference resources in another
# For more information: https://gateway-api.sigs.k8s.io/api-types/referencegrant/
referenceGrant:
  # ReferenceGrant enabled.
  enabled: false
  # ReferenceGrant annotations.
  annotations: {}
  # ReferenceGrant labels.
  labels: {}
  # Namespaces and resources that can reference resources in this namespace.
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: default
  # Resources in this namespace that can be referenced.
  to:
  - group: ""
    kind: Service
  # - group: ""
  #   kind: Secret

# -- Extra manifests to deploy as part of this chart.
# Useful for resources not covered by dedicated templates (e.g., x-k8s.io experimental resources).
extraDeploy: []
