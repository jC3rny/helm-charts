# Default values for grafana-dashboards.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: "gfdsh"

namespaceOverride: ""

trimPrefix: "gfdsh"

folderAnnotation: grafana_dashboard_folder

label: grafana_dashboard
labelValue: "1"

grafana-operator:
  enabled: false

  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana

  folder:
    annotations: {}
      # argocd.argoproj.io/sync-wave: "-1"

    default: ""

  dashboard:
    annotations: {}
      # argocd.argoproj.io/sync-options: ServerSideApply=true
    resyncPeriod: 30m
    contentCacheDuration: ""

category:
  # example:
  #   enabled: true
  #   folder: "_Platform"
  #   plugins:
  #     - name: grafana-clock-panel
  #       version: 1.3.0

  argocd:
    enabled: true
    folder: "_Platform"

  cassandra:
    enabled: false
    folder: "_General"

  ceph:
    enabled: false
    folder: "_Platform"

  cert-manager:
    enabled: true
    folder: "_Platform"

  certificates:
    enabled: true
    folder: "_Platform"

  cloudnative-pg:
    enabled: false
    folder: "_General"

  envoy-gateway:
    enabled: false
    folder: "_Platform"

  external-dns:
    enabled: true
    folder: "_Platform"

  ingress-nginx:
    enabled: true
    folder: "_Platform"

  jmx-exporter:
    enabled: false
    folder: "_General"

  kafka:
    enabled: false
    folder: "_General"

  kubernetes:
    enabled: true
    folder: "_Kubernetes"

  linux:
    enabled: true
    folder: "_Platform"

  loki:
    enabled: true
    folder: "_Platform"

  mariadb:
    enabled: false
    folder: "_General"

  memcached:
    enabled: false
    folder: "_General"

  metallb:
    enabled: false
    folder: "_Platform"

  nginx:
    enabled: false
    folder: "_General"

  postgresql:
    enabled: false
    folder: "_General"

  prometheus:
    enabled: true
    folder: "_Platform"

  rabbitmq:
    enabled: false
    folder: "_General"

  redis:
    enabled: false
    folder: "_General"

  sealed-secrets:
    enabled: false
    folder: "_Platform"

  spring-boot:
    enabled: false
    folder: "_General"

  trivy-operator:
    enabled: true
    folder: "_Platform"
