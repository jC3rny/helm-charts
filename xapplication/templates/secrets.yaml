{{- $env := include "xapplication.render" (dict "value" (.Values.env | default list) "context" .) | fromYamlArray -}}
{{- $remote := list -}}
{{- $sealed := dict -}}
{{- range $env -}}
{{- if hasKey . "remoteRef" -}}
{{- $remote = append $remote (dict "secretKey" .name "remoteRef" .remoteRef) -}}
{{- else if hasKey . "encryptedData" -}}
{{- $_ := set $sealed .name .encryptedData -}}
{{- end -}}
{{- end -}}
{{- with $remote }}
{{- $store := include "xapplication.render" (dict "value" $.Values.externalSecrets "context" $) | fromYaml }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "xapplication.child" (list $ "env") }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "xapplication.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $store.refreshInterval }}
  secretStoreRef:
    kind: {{ $store.secretStoreRef.kind }}
    name: {{ $store.secretStoreRef.name }}
  target:
    name: {{ include "xapplication.child" (list $ "env") }}
    creationPolicy: Owner
  data:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with $sealed }}
{{- $name := include "xapplication.child" (list $ "sealed") }}
{{- $scope := dict "namespace-wide" (dict "sealedsecrets.bitnami.com/namespace-wide" "true") "cluster-wide" (dict "sealedsecrets.bitnami.com/cluster-wide" "true") }}
{{- $scopeAnnotations := index $scope $.Values.sealedSecrets.scope | default dict }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "xapplication.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with $scopeAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  encryptedData:
    {{- toYaml . | nindent 4 }}
  template:
    metadata:
      name: {{ $name }}
      namespace: {{ $.Release.Namespace }}
      {{- with $scopeAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
