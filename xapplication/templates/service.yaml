{{- $v := .Values -}}
{{- $fullname := include "xapplication.fullname" . -}}
{{- $portMap := include "xapplication.portMap" . | fromJson -}}
{{- $app := dict "root" . "canary" false -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xapplication.labels" . | nindent 4 }}
  {{- with $v.service.annotations }}
  annotations:
    {{- include "xapplication.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "xapplication.selectorLabels" $app | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
    {{- range $v.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
{{- if $v.canary.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xapplication.child" (list . "canary") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xapplication.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "xapplication.selectorLabels" (dict "root" . "canary" true) | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
    {{- range $v.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- if eq $v.kind "StatefulSet" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xapplication.child" (list . "headless") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "xapplication.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "xapplication.selectorLabels" $app | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.port }}
      targetPort: http
      protocol: TCP
    {{- range $v.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- range $service := $v.extraServices }}
{{- $ports := $service.ports }}
{{- if not $ports }}
{{- $ports = list "http" }}
{{- range $v.ports }}{{ $ports = append $ports .name }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xapplication.child" (list $ $service.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "xapplication.labels" $ | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- include "xapplication.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type | default "ClusterIP" }}
  {{- with $service.clusterIP }}
  clusterIP: {{ . }}
  {{- end }}
  {{- if $service.publishNotReadyAddresses }}
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "xapplication.selectorLabels" $app | nindent 4 }}
  ports:
    {{- range $ports }}
    - name: {{ . }}
      port: {{ index $portMap . | int }}
      targetPort: {{ . }}
      protocol: TCP
    {{- end }}
{{- end }}
{{- if and $v.metrics.enabled (eq $v.metrics.type "ServiceMonitor") }}
{{- $ports := list }}
{{- range $v.metrics.endpoints }}
{{- $ports = append $ports (include "xapplication.endpointPort" .) }}
{{- end }}
{{- $labels := include "xapplication.labels" . | fromYaml }}
{{- $_ := set $labels "app.kubernetes.io/component" "metrics" }}
---
{{- /* The app's pods and the canary's: selected by app.kubernetes.io/name only. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "xapplication.child" (list . "metrics") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "xapplication.name" . }}
  ports:
    {{- range $ports | uniq }}
    - name: {{ . }}
      port: {{ index $portMap . | int }}
      targetPort: {{ . }}
      protocol: TCP
    {{- end }}
{{- end }}
