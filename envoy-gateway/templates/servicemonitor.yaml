{{- if .Values.metrics.serviceMonitor.enabled -}}
{{- $sm := .Values.metrics.serviceMonitor -}}
{{/*
Envoy Gateway control plane metrics.
gateway-helm ships no ServiceMonitor/PodMonitor template — only the pod annotations
prometheus.io/scrape + prometheus.io/port=19001, which neither kube-prometheus-stack
nor Alloy consumes. The chart's Service already exposes the `metrics` port (19001),
so it can be scraped directly.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envoy-gateway
    app.kubernetes.io/component: control-plane
    {{- with $sm.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with $sm.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      control-plane: envoy-gateway
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: {{ $sm.interval | default .Values.metrics.interval }}
      scrapeTimeout: {{ $sm.scrapeTimeout | default .Values.metrics.scrapeTimeout }}
      {{- with $sm.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
